name: Stereo pose CPU contracts
on:
  push:
    paths: ['StereoPoseLearning/**', '.github/workflows/stereo-pose-cpu.yml']
  pull_request:
    paths: ['StereoPoseLearning/**', '.github/workflows/stereo-pose-cpu.yml']
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: StereoPoseLearning
    env:
      CUDA_VISIBLE_DEVICES: ''
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: StereoPoseLearning/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify geometry, architecture and reproducibility contracts
        run: python -m pytest tests -q
